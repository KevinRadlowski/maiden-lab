@if (href(); as link) {
  @if (external()) {
    <a class="app-text-link" [href]="link" target="_blank" rel="noopener noreferrer">
      <span class="app-text-link__label"><ng-content /></span>
      @if (showArrow()) {
        <span class="app-text-link__arrow" aria-hidden="true">↗</span>
      }
    </a>
  } @else {
    <a class="app-text-link" [routerLink]="link">
      <span class="app-text-link__label"><ng-content /></span>
      @if (showArrow()) {
        <span class="app-text-link__arrow" aria-hidden="true">↗</span>
      }
    </a>
  }
} @else {
  <span class="app-text-link app-text-link--static">
    <span class="app-text-link__label"><ng-content /></span>
    @if (showArrow()) {
      <span class="app-text-link__arrow" aria-hidden="true">↗</span>
    }
  </span>
}
